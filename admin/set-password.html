<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <title>Parolă cont | BCB Business Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-2026.css">
  <link rel="stylesheet" href="../css/admin-set-password.css">
</head>
<body class="bcb-admin-body">
  <main class="bcb-setpass-page">
    <section class="bcb-setpass-card">
      <div class="bcb-setpass-brand"><img src="../assets/images/logo.png" alt="BCB Group"></div>
      <span class="bcb-admin-kicker">BCB Business Manager</span>
      <h1 id="bcb-setpass-title">Alege o parolă nouă.</h1>
      <p id="bcb-setpass-description">Folosește o parolă sigură pentru contul tău BCB.</p>
      <div id="bcb-setpass-message" class="bcb-setpass-message" hidden aria-live="polite"></div>
      <form id="bcb-setpass-form" hidden>
        <label><span>Parolă nouă</span><div class="bcb-setpass-input"><i class="fa-solid fa-lock"></i><input id="bcb-setpass-password" type="password" minlength="10" autocomplete="new-password" required placeholder="Minimum 10 caractere"></div></label>
        <label><span>Confirmă parola</span><div class="bcb-setpass-input"><i class="fa-solid fa-shield-halved"></i><input id="bcb-setpass-confirm" type="password" minlength="10" autocomplete="new-password" required placeholder="Repetă parola"></div></label>
        <button id="bcb-setpass-submit" type="submit"><span>Salvează parola</span><i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <a id="bcb-setpass-login" href="index.html" style="display:block;margin-top:14px;text-align:center;color:#7b642c;font-weight:800;text-decoration:none">Înapoi la autentificare</a>
      <div class="bcb-setpass-security"><i class="fa-solid fa-shield-check"></i><span>Acces securizat prin Supabase Auth. Parola nu este stocată în site-ul BCB.</span></div>
    </section>
  </main>
  <script type="module" src="../js/admin-set-password.js"></script>
  <script src="../js/legal-footer.js"></script>
  <script src="../js/pwa-init.js"></script>
</body>
</html>
