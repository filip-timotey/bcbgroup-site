name: BCB Quality & Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Static HTML integrity
        run: node scripts/validate-static.mjs

      - name: Block accidental server secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-proj-[A-Za-z0-9_-]{16,}|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$[:space:]])' .; then
            echo 'Potential server secret committed to repository.' >&2
            exit 1
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function type checks
        shell: bash
        run: |
          set -euo pipefail
          for file in supabase/functions/*/index.ts; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            deno check "$file"
          done
